# Full stack:      docker compose up --build      -> http://localhost:3000
# Database only:   docker compose up db           (then run backend + frontend locally)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d smart_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/smart_inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      # Replace with your own: openssl rand -base64 64
      JWT_SECRET: ${JWT_SECRET:-XgWJVTvq4F8a3ST01RjCWJN+X7v/imEq3AA3fjprUvBF9EHH1tR9vZZj/dslyEcc5iftx9oV38+/lhdWe+jbVw==}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
